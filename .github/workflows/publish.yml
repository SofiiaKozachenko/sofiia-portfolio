name: Publish original Behance case studies

on:
  push:
    branches: [main]
  schedule:
    # Every morning. A failure leaves the previous successful website online.
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-sync.txt
      - name: Install importer
        run: python -m pip install -r requirements-sync.txt
      - name: Download originals, create high-quality responsive gallery assets, and verify
        id: sync
        continue-on-error: true
        run: python scripts/build_site.py --discover
      - name: Verify deploy is nonempty and offline-capable
        if: steps.sync.outcome == 'success'
        run: python scripts/build_site.py --check-only
      - name: Prepare static production folder
        if: steps.sync.outcome == 'success'
        run: python scripts/stage_site.py
      - name: Reuse last successful case archive when Behance is unavailable
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep all original images, optimized assets, and Vimeo content intact.
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=github-pages" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')"
          if [[ -z "$previous_run" || "$previous_run" == "null" ]]; then
            echo "::error::No previous published gallery archive; keep the existing live site unchanged."
            exit 1
          fi
          mkdir -p /tmp/previous-pages dist
          gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/previous-pages
          test -s /tmp/previous-pages/artifact.tar
          tar -xf /tmp/previous-pages/artifact.tar -C dist
          # Overlay only the new interface, preserving all previous case assets.
          cp -f index.html styles.css app.js sitemap.xml dist/
          test -s dist/content/case-pages.js
          test -s dist/content/behance-imports.js
          test -s dist/assets/favicon.svg
          grep -q 'player.vimeo.com/video/1090989010' dist/content/case-pages.js
          grep -q 'app.js?v=' dist/index.html
          test -s dist/sitemap.xml
          echo "Recovered previous galleries from run $previous_run; deploying updated interface."

      - name: Create and verify optimized responsive character images
        run: python scripts/prepare_character.py
      - name: Verify portrait images in published site
        run: |
          test -s dist/assets/sofiia-fullbody-original.webp
          test -s dist/assets/sofiia-character-mobile.webp
          test -s dist/assets/sofiia-character-optimized.webp
          grep -q 'assets/sofiia-fullbody-original.webp' dist/index.html
          test -s dist/sitemap.xml
          grep -q 'https://sofiiakozachenko.github.io/sofiia-portfolio/' dist/sitemap.xml
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
