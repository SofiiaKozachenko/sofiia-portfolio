name: Update character image to user-supplied version
on:
  push:
    paths:
      - 'scripts/apply_clean_avatar.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lossless WebP support
        run: python -m pip install 'Pillow>=11,<13'
      - name: Rebuild exact portrait from original lossless bytes
        run: python scripts/apply_clean_avatar.py
      - name: Commit the actual updated image file
        run: |
          if git diff --quiet -- assets/sofiia-fullbody-original.webp; then
            echo 'Portrait is already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sofiia-fullbody-original.webp
          git commit -m 'Replace full body character with exact shadow-free original'
          git push origin HEAD:main
